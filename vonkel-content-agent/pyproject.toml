[project]
name = "vonkel-content-agent"
version = "0.1.0"
description = "Geautomatiseerde SEO content agent voor Vonkel Wijnen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "python-slugify>=8.0.4",
    "rich>=13.7.1",
    "markdown-it-py>=3.0.0",
    "beautifulsoup4>=4.12.3",
    "tenacity>=9.0.0",
]

[project.scripts]
vonkel-agent = "src.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
