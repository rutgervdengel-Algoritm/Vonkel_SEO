# seo_targets.yaml — Topic cluster model voor Vonkel Wijnen
#
# Publicatievolgorde eerste 6 weken (scores zijn hierop afgestemd):
#   Week 1: Jordan spotlight (klaar)
#   Week 2: Chenin Blanc uit Zuid-Afrika        → score 95
#   Week 3: Welke wijn bij braai                → score 94
#   Week 4: Thistle & Weed spotlight            → score 93
#   Week 5: Pinotage zonder vooroordelen        → score 91
#   Week 6: Keermont spotlight                  → score 89

pillars:

  zuid_afrikaanse_wijn:
    title: "Zuid-Afrikaanse wijn voor Nederlandse liefhebbers"
    slug: zuid-afrikaanse-wijn
    coverage_target: 6
    description: >
      Pillar die de brede context neerzet: streken, druiven, stijlen,
      waarom Zuid-Afrika als wijnland anders is.
    primary_keyword: "Zuid-Afrikaanse wijn"
    search_intent: informational
    target_url_path: /blogs/zuid-afrika/zuid-afrikaanse-wijn-gids
    clusters:
      - title: "Chenin Blanc uit Zuid-Afrika: waarom het niet op Vouvray lijkt"
        keyword: "Chenin Blanc Zuid-Afrika"
        intent: informational
        opportunity_score: 95
        angle: >
          Verschil met Loire (warmer, droger, meer textuur), old vines.
          Drie heel verschillende stijlen uit ons assortiment: Thistle & Weed
          Brandnetel (Simonsberg, 40+ jaar), Keermont Terrasse (blend met
          Chardonnay), Remhoogte First Light (toegankelijke ingang).
        linked_products:
          - thistle-and-weed-brandnetel-chenin-blanc-stellenbosch
          - keermont-terrasse-stellenbosch
          - remhoogte-first-light-chenin-blanc-stellenbosch
      - title: "Pinotage zonder vooroordelen: het verhaal achter de Zuid-Afrikaanse handtekening"
        keyword: "Pinotage uitleg"
        intent: informational
        opportunity_score: 91
        angle: >
          Slechte reputatie nuanceren (rubber jaren 90 vs. moderne stijlen).
          Beaumont is het concrete tegenbewijs: biologisch, Walker Bay, koeler
          klimaat — geen rubber. Dat is de haak.
        linked_products:
          - beaumont-pinotage-walker-bay
      - title: "Stellenbosch: wat je moet weten over Zuid-Afrika's bekendste streek"
        keyword: "Stellenbosch wijn"
        intent: informational
        opportunity_score: 65
        angle: >
          Bodemvariatie, hoogteverschil, diverse stijlen. Jordan als premium
          benchmark, Keermont als bewijs dat Stellenbosch ook finesse kan,
          Remhoogte als toegankelijke instapper.
        linked_products:
          - jordan-barrel-fermented-chardonnay-stellenbosch
          - keermont-syrah-stellenbosch
          - remhoogte-first-light-chenin-blanc-stellenbosch

  wijn_en_spijs:
    title: "Wijn-spijs combinaties met Zuid-Afrikaanse wijn"
    slug: wijn-en-spijs
    coverage_target: 5
    description: >
      Commercieel-intentie pillar. Mensen die "wat drink ik bij X" zoeken
      zijn dichter bij een aankoop. Elk cluster koppelt een concreet gerecht
      aan 1-2 wijnen uit ons assortiment.
    primary_keyword: "wijn-spijs Zuid-Afrika"
    search_intent: commercial
    target_url_path: /blogs/wijn-en-spijs/wijn-spijs-gids
    clusters:
      - title: "Welke wijn bij braai: Zuid-Afrikaanse keuzes voor op de barbecue"
        keyword: "wijn bij braai"
        intent: commercial
        opportunity_score: 94
        angle: >
          Braai = bbq in ZA cultuur. Rood vlees → Keermont Syrah of Beaumont
          Pinotage. Vis/groente op de braai → Keermont Terrasse of Thistle & Weed.
          Seizoensrelevantie (mei-september) expliciet verwerken.
        linked_products:
          - keermont-syrah-stellenbosch
          - beaumont-pinotage-walker-bay
          - keermont-terrasse-stellenbosch
      - title: "Zuid-Afrikaanse wijn cadeau onder 35 euro"
        keyword: "Zuid-Afrikaanse wijn cadeau"
        intent: transactional
        opportunity_score: 75
        angle: >
          Seizoenspiek rond kerst/vaderdag/moederdag. Drie prijslagen:
          Remhoogte First Light of Soaring Eagle (€14.95 — verrassend veel
          voor het geld), Beaumont Pinotage (€19.95 — iets bijzonders),
          Thistle & Weed Brandnetel (€27.95 — voor de kenner). Eerlijk over
          wat je voor dat geld krijgt.
        linked_products:
          - remhoogte-first-light-chenin-blanc-stellenbosch
          - beaumont-pinotage-walker-bay
          - thistle-and-weed-brandnetel-chenin-blanc-stellenbosch
      - title: "Chenin Blanc bij vis: wanneer het werkt en wanneer niet"
        keyword: "Chenin Blanc bij vis"
        intent: commercial
        opportunity_score: 72
        angle: >
          Thistle & Weed Brandnetel bij gegrilde vis met saus (textuur en
          zuur vangen het vet). Keermont Terrasse bij lichtere vis.
          Eerlijk: niet bij oesters of sashimi.
        linked_products:
          - thistle-and-weed-brandnetel-chenin-blanc-stellenbosch
          - keermont-terrasse-stellenbosch
      - title: "Welke wijn bij bobotie"
        keyword: "wijn bij bobotie"
        intent: commercial
        opportunity_score: 70
        angle: >
          Zoet-hartige balance vraagt om licht rood of aromatisch wit.
          Beaumont Pinotage (fruitig, geen tannine-bom) of Remhoogte
          Soaring Eagle als Cape Blend. Zeldzame NL zoekterm, lage concurrentie.
        linked_products:
          - beaumont-pinotage-walker-bay
          - remhoogte-soaring-eagle-stellenbosch

  ontdek_het_wijnhuis:
    title: "Ontmoet de wijnhuizen in onze selectie"
    slug: wijnhuizen
    coverage_target: 5
    description: >
      Producer-spotlights, één per wijnmaker in de selectie. Bottom-funnel
      transactionele pagina's die de productpagina ondersteunen met
      verhaal + E-E-A-T. Altijd gekoppeld aan een concreet product.
    primary_keyword: "[wijnhuis] Zuid-Afrika"
    search_intent: transactional
    target_url_path: /blogs/wijnhuizen
    clusters:
      - title: "Jordan Wine Estate: geoloog maakt Chardonnay in Stellenbosch"
        keyword: "Jordan Chardonnay"
        intent: transactional
        opportunity_score: 92
        angle: Gary Jordan als geoloog, hoe hij terroir leest, Decanter award als objectief bewijs
        published: true
        linked_products:
          - jordan-barrel-fermented-chardonnay-stellenbosch
      - title: "Thistle & Weed: Chenin Blanc van 40 jaar oude stokken op de Simonsberg"
        keyword: "Thistle Weed wijn"
        intent: transactional
        opportunity_score: 93
        angle: >
          De Brandnetel komt van een minuscuul perceel 40+ jaar oude stokken
          op de Simonsberg. Tim Atkin 96 punten. Waarom dat perceel er toe doet,
          wat old vines betekenen voor smaak, en wat je concreet in het glas krijgt.
          Eerlijk: dit is geen alledaagse wijn.
        linked_products:
          - thistle-and-weed-brandnetel-chenin-blanc-stellenbosch
      - title: "Keermont: drie wijnen van één domein in de Blaauwklippen Valley"
        keyword: "Keermont wijn"
        intent: transactional
        opportunity_score: 89
        angle: >
          Keermont Vineyards in de Blaauwklippen Valley, Stellenbosch. Drie heel
          andere wijnen van hetzelfde domein: rosé (4 Barrels), wit (Terrasse),
          rood (Syrah). Dat we alle drie voeren is het verhaal — toon wat het
          domein kan over de volle breedte.
        linked_products:
          - keermont-4-barrels-rose-stellenbosch
          - keermont-terrasse-stellenbosch
          - keermont-syrah-stellenbosch
      - title: "Remhoogte: twee wijnen als eerlijke instapper in Stellenbosch"
        keyword: "Remhoogte wijn"
        intent: transactional
        opportunity_score: 80
        angle: >
          Remhoogte op de Simonsberg. First Light Chenin Blanc (€14.95, oude
          stokken, wit) en Soaring Eagle Cape Blend (€14.95, rood) zijn de
          twee goedkoopste wijnen in onze selectie — maar dat is geen excuus
          voor slordigheid. Wat je voor dat geld krijgt en waarom ze erin zitten.
        linked_products:
          - remhoogte-first-light-chenin-blanc-stellenbosch
          - remhoogte-soaring-eagle-stellenbosch
      - title: "Beaumont: biologische Pinotage uit Walker Bay"
        keyword: "Beaumont Pinotage"
        intent: transactional
        opportunity_score: 77
        angle: >
          Historisch familiedomein in Bot River/Walker Bay. Biologisch. Pinotage
          uit een koeler klimaat — dat maakt verschil voor het druivenras met de
          slechtste reputatie in ZA. Concrete haak: Walker Bay is 300 km
          verwijderd van de Stellenbosch-warmte.
        linked_products:
          - beaumont-pinotage-walker-bay

# Kandidaat-keywords voor research.py
research_seeds:
  - "Zuid-Afrikaanse wijn Nederland"
  - "beste Chenin Blanc"
  - "Pinotage smaak"
  - "wijn cadeau onder 35 euro"
  - "Zuid-Afrikaanse wijn cadeau"
  - "Chenin Blanc bij vis"
  - "wijn bij braai"
  - "Thistle Weed wijn kopen"
  - "Keermont wijn Stellenbosch"
  - "Remhoogte wijn"
  - "Beaumont Pinotage"
  - "biologische wijn Zuid-Afrika"
  - "Pinotage Walker Bay"
  - "wijn bij bobotie"

# Scoring gewichten voor planner
scoring:
  weights:
    competition_weakness: 0.4
    assortment_relevance: 0.35
    long_tail_potential: 0.15
    pillar_coverage_gap: 0.10
