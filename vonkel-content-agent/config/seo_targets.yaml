# seo_targets.yaml — Topic cluster model voor Vonkel Wijnen
#
# Het topic cluster model werkt als volgt:
#   - Iedere "pillar" is een breed, evergreen onderwerp (bv. "Zuid-Afrikaanse wijn")
#   - Clusters zijn long-tail subtopics onder die pillar
#   - Ieder cluster-artikel linkt naar zijn pillar; pillar linkt naar clusters
#   - Dit bouwt topical authority richting Google zonder dat we adverteren
#
# Werkwijze voor de planner:
#   1. Kies eerst een pillar met de laagste dekking (coverage_target vs huidige)
#   2. Kies daarbinnen het cluster-item met de hoogste opportunity_score
#   3. Kies angle passend bij search_intent
#
# Publicatievolgorde eerste 6 weken (scores zijn hierop afgestemd):
#   Week 1: Jordan spotlight (klaar)
#   Week 2: Chenin Blanc uit Zuid-Afrika        → score 95
#   Week 3: Welke wijn bij braai                → score 94
#   Week 4: Thistle & Weed spotlight            → score 93
#   Week 5: Pinotage zonder vooroordelen        → score 91
#   Week 6: Keermont spotlight                  → score 89

pillars:

  zuid_afrikaanse_wijn:
    title: "Zuid-Afrikaanse wijn voor Nederlandse liefhebbers"
    slug: zuid-afrikaanse-wijn
    coverage_target: 8
    description: >
      Pillar die de brede context neerzet: geschiedenis, streken, stijlen,
      waarom Zuid-Afrika als wijnland anders is. De lander voor mensen die
      verder willen dan Bordeaux en Rioja.
    primary_keyword: "Zuid-Afrikaanse wijn"
    search_intent: informational
    target_url_path: /blogs/zuid-afrika/zuid-afrikaanse-wijn-gids
    clusters:
      - title: "Chenin Blanc uit Zuid-Afrika: waarom het niet op Vouvray lijkt"
        keyword: "Chenin Blanc Zuid-Afrika"
        intent: informational
        opportunity_score: 95
        angle: >
          Verschil met Loire (warmer, droger, meer textuur), old vines in Swartland
          en Stellenbosch, stilistisch spectrum van houtvrij fris tot amfora-complex.
          Mullineux, Sadie en Alheit als concrete voorbeelden uit ons assortiment.
        linked_products: [mullineux-old-vines-white, sadie-palladius, alheit-cartology]
      - title: "Pinotage zonder vooroordelen: het verhaal achter de Zuid-Afrikaanse handtekening"
        keyword: "Pinotage uitleg"
        intent: informational
        opportunity_score: 91
        angle: >
          Slechte reputatie nuanceren (rubbery jaren 90 vs. moderne stijlen),
          wat je kunt verwachten, Kanonkop als serieus referentiepunt.
        linked_products: [kanonkop-kadette]
      - title: "Stellenbosch: wat je moet weten over Zuid-Afrika's bekendste streek"
        keyword: "Stellenbosch wijn"
        intent: informational
        opportunity_score: 65
        angle: >
          Stellenbosch als veilige ingang in ZA wijn, nadruk op bodemvariatie
          (graniet vs. klei), hoogteverschil, diverse stijlen. Jordan als anker.
        linked_products: [jordan-chardonnay, kanonkop-kadette]
      - title: "Methode Cap Classique: de Zuid-Afrikaanse mousserende wijn"
        keyword: "Methode Cap Classique"
        intent: informational
        opportunity_score: 68
        angle: >
          Verschil met champagne (klimaat, druivenrassen, prijs-kwaliteit),
          Graham Beck als toegankelijk startpunt, Obama-anekdote als haak.
        linked_products: [graham-beck-brut-rose]

  wijn_en_spijs:
    title: "Wijn-spijs combinaties met Zuid-Afrikaanse wijn"
    slug: wijn-en-spijs
    coverage_target: 6
    description: >
      Commercieel-intentie pillar. Mensen die "wat drink ik bij X" zoeken
      zijn dichter bij een aankoop. Elk cluster koppelt een concreet gerecht
      aan 1-2 wijnen uit ons assortiment.
    primary_keyword: "wijn-spijs Zuid-Afrika"
    search_intent: commercial
    target_url_path: /blogs/wijn-en-spijs/wijn-spijs-gids
    clusters:
      - title: "Welke wijn bij braai: Zuid-Afrikaanse keuzes voor op de barbecue"
        keyword: "wijn bij braai"
        intent: commercial
        opportunity_score: 94
        angle: >
          Braai = bbq in ZA cultuur, geeft het artikel autoriteit. Rood vlees →
          Kanonkop Pinotage of Boekenhoutskloof Syrah. Vis/groente op de braai →
          Chenin of Mullineux. Seizoensrelevantie (mei-september) expliciet noemen.
        linked_products: [kanonkop-kadette, boekenhoutskloof-syrah, mullineux-old-vines-white]
      - title: "Welke wijn bij bobotie"
        keyword: "wijn bij bobotie"
        intent: commercial
        opportunity_score: 70
        angle: >
          Specifiek Kaaps gerecht, zoet-hartige balance vraagt om licht rood of
          off-dry wit. Zeldzame NL zoekterm met lage concurrentie. Pinotage of
          Chenin als suggestie, uitleggen waarom.
        linked_products: [kanonkop-kadette, mullineux-old-vines-white]
      - title: "Chenin Blanc bij vis: wanneer het werkt en wanneer niet"
        keyword: "Chenin Blanc bij vis"
        intent: commercial
        opportunity_score: 72
        angle: >
          Specifieker en eerlijker dan de generieke "Chardonnay bij vis"-aanpak.
          Mullineux of Sadie bij gegrilde vis met saus, niet bij oesters.
          Uitleg waarom textuur en zuur van Chenin beter matcht dan houtgelagerde
          Chardonnay bij delicate vis.
        linked_products: [mullineux-old-vines-white, alheit-cartology]
      - title: "Zuid-Afrikaanse wijn cadeau onder 35 euro"
        keyword: "Zuid-Afrikaanse wijn cadeau"
        intent: transactional
        opportunity_score: 75
        angle: >
          Seizoenspiek rond kerst/vaderdag/moederdag. Transactionele intent:
          mensen zoeken een cadeau, niet een cursus wijn. Drie concrete
          suggesties op prijs (onder €25, €25-35, iets bijzonders). Eerlijk
          over wat je voor dat geld krijgt.
        linked_products: [kanonkop-kadette, graham-beck-brut-rose, mullineux-old-vines-white]

  ontdek_het_wijnhuis:
    title: "Ontmoet de wijnhuizen in onze selectie"
    slug: wijnhuizen
    coverage_target: 8
    description: >
      Producer-spotlights, één per wijnmaker in de selectie. Dit zijn
      bottom-funnel transactionele pagina's die de productpagina ondersteunen
      met verhaal + E-E-A-T. Altijd gekoppeld aan een concreet product.
    primary_keyword: "[wijnhuis] Zuid-Afrika"
    search_intent: transactional
    target_url_path: /blogs/wijnhuizen
    clusters:
      - title: "Jordan Wine Estate: geoloog maakt Chardonnay in Stellenbosch"
        keyword: "Jordan Chardonnay"
        intent: transactional
        opportunity_score: 92
        angle: Gary Jordan als geoloog, hoe hij terroir leest, Decanter award als objectief bewijs
        linked_products: [jordan-chardonnay]
        published: true  # week 1 — al klaar
      - title: "Thistle & Weed: natuurwijn uit Zuid-Afrika met een eigen logica"
        keyword: "Thistle & Weed wijn"
        intent: transactional
        opportunity_score: 93
        angle: >
          Franco Lourens' aanpak: geen toegevoegd sulfiet, wilde gisting, Cinsault
          en Chenin uit oude wijngaarden. Waarom dit anders is dan de gemiddelde
          "natural wine" kreet. Eerlijk: niet voor iedereen, wel voor wie nieuws
          zoekt.
        linked_products: [thistle-weed-roller-pigeon, thistle-weed-wine]
      - title: "Keermont: drie wijnen, één steile helling in Stellenbosch"
        keyword: "Keermont wijn"
        intent: transactional
        opportunity_score: 89
        angle: >
          Alex Starey's terroir-focus op de Banghoek vallei. Drie wijnen die
          elk een ander stuk van de helling laten horen. Zeldzaam in NL,
          drie producten in onze selectie = extra SEO-voordeel per artikel.
        linked_products: [keermont-fleurfontein, keermont-terrasse, keermont-topside]
      - title: "Remhoogte: familiewijnhuis met twee gezichten in Stellenbosch"
        keyword: "Remhoogte wijn"
        intent: transactional
        opportunity_score: 80
        angle: >
          Murray Boustred combineert toegankelijke blends met serieuze
          single-vineyard bottlingen. Twee producten in onze selectie,
          goed als ingang voor mensen die ZA wijn nog ontdekken.
        linked_products: [remhoogte-bouquet-blanc, remhoogte-estate-red]

# Kandidaat-keywords voor research.py
research_seeds:
  - "Zuid-Afrikaanse wijn Nederland"
  - "beste Chenin Blanc"
  - "Pinotage smaak"
  - "Syrah Zuid-Afrika"
  - "wijn cadeau onder 35 euro"
  - "Zuid-Afrikaanse wijn cadeau"
  - "wijn bij lamsvlees"
  - "natuurwijn Zuid-Afrika"
  - "Chenin Blanc bij vis"
  - "wijn bij braai"
  - "Thistle Weed wijn kopen"
  - "Keermont wijn"
  - "Remhoogte wijn"
  - "Methode Cap Classique Nederland"

# Scoring gewichten voor planner
scoring:
  weights:
    competition_weakness: 0.4 # hoe zwak is top-10 concurrentie (0-1)
    assortment_relevance: 0.35 # linkt naar product in onze selectie?
    long_tail_potential: 0.15 # lagere volume = lagere concurrentie
    pillar_coverage_gap: 0.10 # vult cluster dat ondervertegenwoordigd is
